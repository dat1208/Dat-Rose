name: Release

# Builds the D-Changer app and publishes it as a GitHub release when a version
# tag (v0.1.0) is pushed. The app's updater reads latest.json from the release,
# so tagging a version is all it takes to ship an update.
#
# Required repository secret:
#   TAURI_SIGNING_PRIVATE_KEY          - the private key from `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - its password (empty string if none)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Install Python build dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Build the engine (PyInstaller)
        working-directory: backend
        run: pyinstaller --clean --noconfirm D-Changer.spec

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build the app (UI + Tauri bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build_dchanger.py --skip-backend

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/*.sig
            ui/src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
